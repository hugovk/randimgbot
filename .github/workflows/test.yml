name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.12", "3.11", "3.12", "3.13", "3.14"]
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - name: Install requirements
        run: |
          uv venv
          uv pip install -U -r requirements.txt

      - name: Test run
        run: |
          uv run randimgbot.py --help

          uv run randimgbot.py --test --yaml data/randimgbot_example.yaml --inspec data/randimgbot_example.json --chance 100000
          uv run randimgbot.py --test --yaml data/randimgbot_example.yaml --inspec data/randimgbot_example.json --chance 1

  success:
    needs: test
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        run: echo Test successful
